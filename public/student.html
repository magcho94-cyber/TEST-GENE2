<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>VOCA Student</title></head><body><div class="wrap"><div class="card"><h2>JONGRO M VOCA</h2><div id="join"><input id="name" placeholder="이름"><select id="set"></select><button onclick="join()">입장</button></div><div id="game"></div></div></div><script src="/socket.io/socket.io.js"></script><script>
const s=io(),p=new URLSearchParams(location.search),room=p.get("room");s.emit("getSets",room);s.on("sets",a=>set.innerHTML=a.map(x=>`<option value="${x.id}">${x.name}</option>`).join(""));function join(){s.emit("join",{c:room,n:name.value,setId:set.value})}s.on("ok",x=>{join=document.getElementById("join");join.style.display="none";game.innerHTML="<h3>대기 중...</h3>"});s.on("q",q=>{game.innerHTML=`<h3>${q.n}/${q.total} · ${q.t}</h3>`+q.o.map((x,i)=>`<button style="display:block;width:100%;margin:8px 0" onclick="ans(${i+1})">${i+1}. ${x}</button>`).join("")});function ans(a){s.emit("ans",{c:room,a});game.innerHTML="<h3>제출 완료</h3>"}s.on("result",r=>game.innerHTML=`<h2>${r.good?"정답!":"오답"}</h2><p>정답: ${r.correct}번</p>`);s.on("endStudent",x=>game.innerHTML="<h2>시험 종료</h2><h3>TOP 3</h3>"+x.overall.map((z,i)=>`<p>${["🥇","🥈","🥉"][i]} ${z.n} · ${z.correct}/${z.total}</p>`).join(""));
</script></body></html>
