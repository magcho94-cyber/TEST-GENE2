<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><title>VOCA Host</title></head><body><div class="wrap"><div class="card"><h2>VOCA 교사용 진행</h2><div id="info"></div><button onclick="s.emit('start',room)">시험 시작</button><div id="list"></div></div></div><script src="/socket.io/socket.io.js"></script><script>
const s=io(),room=new URLSearchParams(location.search).get("room");s.emit("host",room);info.innerHTML="<h3>방 번호 "+room+"</h3>";s.on("names",a=>list.innerHTML="<h3>입장 학생 "+a.length+"명</h3>"+a.map(x=>`<p>${x.n} · ${x.setName}</p>`).join(""));s.on("scores",x=>list.innerHTML="<h3>실시간 성적</h3>"+x.students.sort((a,b)=>b.correct-a.correct).map(z=>`<p>${z.n}: ${z.correct}/${z.total}</p>`).join(""));s.on("endHost",a=>list.innerHTML="<h2>시험 종료</h2>"+a.map((z,i)=>`<p>${i+1}위 ${z.n}: ${z.correct}/${z.total} · 오답: ${(z.wrong||[]).map(w=>w.word).join(", ")}</p>`).join(""));
</script></body></html>
